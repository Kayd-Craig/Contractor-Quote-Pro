openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Quick Quote API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: products
    description: Product search from home improvement stores
  - name: quotes
    description: Quote sending operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /products/search:
    get:
      operationId: searchProducts
      tags: [products]
      summary: Search products from Home Depot and Lowe's
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Search query
        - name: store
          in: query
          required: false
          schema:
            type: string
            enum: [homedepot, lowes, all]
            default: all
          description: Filter by store
      responses:
        "200":
          description: Product search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductSearchResult"

  /quotes/payment:
    post:
      operationId: createPayment
      tags: [quotes]
      summary: Create a Stripe checkout session for quote payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentRequest"
      responses:
        "200":
          description: Checkout session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatePaymentResult"

  /quotes/payment-status/{sessionId}:
    get:
      operationId: getPaymentStatus
      tags: [quotes]
      summary: Check payment status for a checkout session
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Payment status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentStatusResult"

  /connect/onboard:
    post:
      operationId: connectOnboard
      tags: [connect]
      summary: Create a Stripe Connect Express account and return onboarding link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectOnboardRequest"
      responses:
        "200":
          description: Onboarding link created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectOnboardResult"

  /connect/status:
    get:
      operationId: getConnectStatus
      tags: [connect]
      summary: Check Stripe Connect account status
      parameters:
        - name: account_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Account status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectStatusResult"

  /connect/dashboard:
    get:
      operationId: getConnectDashboard
      tags: [connect]
      summary: Get Stripe Express dashboard login link
      parameters:
        - name: account_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Dashboard link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectDashboardResult"

  /connect/balance:
    get:
      operationId: getConnectBalance
      tags: [connect]
      summary: Get contractor balance from connected Stripe account
      parameters:
        - name: account_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Balance info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectBalanceResult"

  /quotes/send:
    post:
      operationId: sendQuote
      tags: [quotes]
      summary: Send a formatted quote to the customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendQuoteRequest"
      responses:
        "200":
          description: Quote sent successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendQuoteResult"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Product:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        brand:
          type: string
        price:
          type: number
          description: Unit price in dollars
        unit:
          type: string
          description: Unit of measure (each, sq ft, linear ft, bag, etc.)
        store:
          type: string
          enum: [homedepot, lowes]
        sku:
          type: string
        category:
          type: string
        inStock:
          type: boolean
        contractorPrice:
          type: number
          description: Contractor/pro price if available
        imageUrl:
          type: string
      required:
        - id
        - name
        - brand
        - price
        - unit
        - store
        - sku
        - category
        - inStock

    ProductSearchResult:
      type: object
      properties:
        products:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        query:
          type: string
        total:
          type: integer
      required:
        - products
        - query
        - total

    QuoteLineItem:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [material, labor]
        description:
          type: string
        quantity:
          type: number
        unit:
          type: string
        unitPrice:
          type: number
        markupPercent:
          type: number
        store:
          type: string
          nullable: true
        sku:
          type: string
          nullable: true
      required:
        - id
        - type
        - description
        - quantity
        - unit
        - unitPrice
        - markupPercent

    CreatePaymentRequest:
      type: object
      properties:
        customerName:
          type: string
        customerEmail:
          type: string
          nullable: true
        jobDescription:
          type: string
        amount:
          type: number
          description: Total amount in dollars
        quoteId:
          type: string
          nullable: true
        contractorName:
          type: string
          nullable: true
        businessName:
          type: string
          nullable: true
        stripeAccountId:
          type: string
          nullable: true
          description: Contractor's Stripe Connect account ID for split payments
      required:
        - customerName
        - jobDescription
        - amount

    ConnectOnboardRequest:
      type: object
      properties:
        email:
          type: string
          nullable: true
        businessName:
          type: string
          nullable: true
        contractorName:
          type: string
          nullable: true

    ConnectOnboardResult:
      type: object
      properties:
        accountId:
          type: string
        onboardingUrl:
          type: string
      required:
        - accountId
        - onboardingUrl

    ConnectStatusResult:
      type: object
      properties:
        accountId:
          type: string
        status:
          type: string
          description: "Account status: active, pending, incomplete"
        chargesEnabled:
          type: boolean
        payoutsEnabled:
          type: boolean
        detailsSubmitted:
          type: boolean
        email:
          type: string
          nullable: true
        businessName:
          type: string
          nullable: true
      required:
        - accountId
        - status
        - chargesEnabled
        - payoutsEnabled
        - detailsSubmitted

    ConnectDashboardResult:
      type: object
      properties:
        dashboardUrl:
          type: string
      required:
        - dashboardUrl

    ConnectBalanceResult:
      type: object
      properties:
        availableBalance:
          type: number
        pendingBalance:
          type: number
        currency:
          type: string
      required:
        - availableBalance
        - pendingBalance
        - currency

    CreatePaymentResult:
      type: object
      properties:
        success:
          type: boolean
        sessionId:
          type: string
        paymentUrl:
          type: string
          nullable: true
        serviceFee:
          type: number
          description: Service fee amount in dollars (3% + $0.50)
      required:
        - success
        - sessionId

    PaymentStatusResult:
      type: object
      properties:
        sessionId:
          type: string
        status:
          type: string
          description: "Payment status: paid, unpaid, no_payment_required"
        amountTotal:
          type: number
        customerEmail:
          type: string
          nullable: true
        paymentUrl:
          type: string
          nullable: true
      required:
        - sessionId
        - status
        - amountTotal

    SendQuoteRequest:
      type: object
      properties:
        customerName:
          type: string
        customerEmail:
          type: string
          nullable: true
        customerPhone:
          type: string
          nullable: true
        jobAddress:
          type: string
          nullable: true
        jobDescription:
          type: string
        businessName:
          type: string
          nullable: true
        contractorName:
          type: string
        contractorPhone:
          type: string
          nullable: true
        contractorEmail:
          type: string
          nullable: true
        contractorLicense:
          type: string
          nullable: true
        logoBase64:
          type: string
          nullable: true
          description: Base64-encoded logo image (data URI or raw base64)
        lineItems:
          type: array
          items:
            $ref: "#/components/schemas/QuoteLineItem"
        materialSubtotal:
          type: number
        laborSubtotal:
          type: number
        markupAmount:
          type: number
        discountAmount:
          type: number
          nullable: true
        discountType:
          type: string
          enum: [percent, flat]
          nullable: true
        taxRate:
          type: number
          nullable: true
        taxAmount:
          type: number
          nullable: true
        total:
          type: number
        sendMethod:
          type: string
          enum: [email, sms, both]
        quoteFont:
          type: string
          enum: [classic, modern, elegant, clean]
        quoteTemplate:
          type: string
          enum: [typewriter, professional, bold, minimal]
      required:
        - customerName
        - jobDescription
        - contractorName
        - lineItems
        - materialSubtotal
        - laborSubtotal
        - markupAmount
        - total
        - sendMethod

    SendQuoteResult:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        quoteText:
          type: string
          description: Formatted plain-text quote for sharing
        pdfBase64:
          type: string
          description: Base64-encoded PDF file
      required:
        - success
        - message
        - quoteText
        - pdfBase64
